[project]
name = "aegis-twin"
version = "0.2.0"
description = "AEGIS Twin — logistics network digital twin (PNT1)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: long-running benchmarks (run with: pytest -m slow)"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning"]
