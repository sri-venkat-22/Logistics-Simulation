# CI (Phase 8): lint, types, tests with coverage, the Playwright demo smoke test, dependency audits, Docker builds and
# an image vulnerability scan. Runs on every push and pull request.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  python:
    name: Python · ruff · mypy · pytest
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: aegis_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      AEGIS_DB_URL: postgresql+psycopg://postgres:postgres@localhost/aegis_test
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: "requirements*.txt"}
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1
          pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Migrate the test database
        working-directory: services/api
        run: alembic upgrade head
      - name: Pytest (with coverage)
        # Redis DBs 13-15 and the aegis_test database; the red-team telemetry file is not in git, so that one benchmark
        # test skips here (its score is recorded in docs/trust/benchmark.json)
        env:
          AEGIS_TEST_DB_URL: postgresql+psycopg://postgres:postgres@localhost/aegis_test
        run: pytest -q --cov=services --cov=sim --cov=ml --cov-report=term-missing:skip-covered --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: coverage-xml, path: coverage.xml, if-no-files-found: ignore}
      - name: pip-audit
        run: pip-audit -r requirements.txt --progress-spinner off

  web:
    name: Web · eslint · tsc · vitest · build · audit
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc -b --noEmit
      - run: npm test
      - run: npm run build
      - name: npm audit gate (high / critical, reviewed allow-list)
        run: node scripts/audit.mjs --omit=dev

  e2e:
    name: Playwright smoke (demo flow)
    runs-on: ubuntu-24.04
    needs: [python, web]
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: aegis_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      AEGIS_DB_URL: postgresql+psycopg://postgres:postgres@localhost/aegis_test
      AEGIS_E2E_DB_URL: postgresql+psycopg://postgres:postgres@localhost/aegis_test
      PYTHON: python
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: "requirements*.txt"}
      - uses: actions/setup-node@v4
        with: {node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1 && pip install -r requirements.txt
      - working-directory: services/api
        run: alembic upgrade head
      - working-directory: apps/web
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - working-directory: apps/web
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: playwright-report, path: apps/web/playwright-report, if-no-files-found: ignore}

  docker:
    name: Docker build · Trivy · Caddyfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image
        uses: docker/build-push-action@v6
        with: {context: ., file: infra/docker/api.Dockerfile, tags: "aegis-api:ci", load: true, cache-from: type=gha, cache-to: "type=gha,mode=max"}
      - name: Build the web image
        uses: docker/build-push-action@v6
        with: {context: ., file: infra/docker/web.Dockerfile, tags: "aegis-web:ci", load: true, cache-from: type=gha, cache-to: "type=gha,mode=max"}
      - name: Validate the Caddyfile
        run: docker run --rm -e AEGIS_DOMAIN=aegis.example.tech -e ACME_EMAIL=ops@example.tech aegis-web:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      # blocking: fixable CRITICAL findings; reported: fixable HIGH findings (triaged, see docs/security/SECURITY.md)
      - name: Trivy (API image) · critical gate
        uses: aquasecurity/trivy-action@0.28.0
        with: {image-ref: "aegis-api:ci", severity: "CRITICAL", ignore-unfixed: true, exit-code: "1", vuln-type: "os,library"}
      - name: Trivy (API image) · high report
        uses: aquasecurity/trivy-action@0.28.0
        with: {image-ref: "aegis-api:ci", severity: "HIGH", ignore-unfixed: true, exit-code: "0", vuln-type: "os,library"}
      - name: Trivy (web image) · critical gate
        uses: aquasecurity/trivy-action@0.28.0
        with: {image-ref: "aegis-web:ci", severity: "CRITICAL", ignore-unfixed: true, exit-code: "1", vuln-type: "os,library"}
